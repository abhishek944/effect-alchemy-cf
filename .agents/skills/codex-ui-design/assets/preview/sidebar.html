<aside class="sidebar" aria-label="Sample sidebar">
  <div class="side-heading">
    <strong>Codex</strong><span class="muted">{{icon:chevron-down}}</span><span class="push"></span
    ><button
      class="icon"
      aria-label="Notifications"
      data-feedback="Notifications: local visual specimen."
    >
      {{icon:bell}}
    </button>
    <button class="icon" aria-label="Search" data-feedback="Search: local visual specimen.">
      {{icon:search}}
    </button>
  </div>
  <button class="row">{{icon:square-pen}}<span>New chat</span></button>
  <div class="section-label">Pinned</div>
  <button class="row">{{icon:message-circle}}<span>Pinned conversation</span></button
  ><button class="row">{{icon:folder-closed}}<span>Sample workspace</span></button>
  <div class="section-label">Projects</div>
  <button class="row">{{icon:folder-closed}}<span>Example project</span></button
  ><button class="row sub selected">
    {{icon:message-circle}}<span>Document design system</span></button
  ><button class="row">{{icon:folder-closed}}<span>Another workspace</span></button
  ><button class="row sub">{{icon:message-circle}}<span>Inspect component states</span></button
  ><button class="row sub">{{icon:message-circle}}<span>Compare typography</span></button
  ><button class="row">{{icon:folder-closed}}<span>Personal project</span></button>
  <div class="section-label recents">Recents</div>
  <button class="row">{{icon:message-circle}}<span>Design system review</span></button
  ><button class="row">{{icon:message-circle}}<span>Component calibration</span></button>
</aside>
